name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    name: Tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Verify release files
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css
          node -e "const m = require('./manifest.json'); if (!/^\\d+\\.\\d+\\.\\d+$/.test(m.version)) process.exit(1); if (m.minAppVersion !== '1.7.2') process.exit(1)"

      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: flashcard-plugin-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
