name: Release FlashCard

on:
  push:
    tags:
      - '*.*.*'
    branches:
      - 'release/*'

permissions:
  contents: write

jobs:
  release:
    name: Test and publish release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Verify version and compatibility metadata
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == release/* ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#release/}"
          else
            RELEASE_VERSION="$GITHUB_REF_NAME"
          fi
          test "$RELEASE_VERSION" = "$(node -p "require('./manifest.json').version")"
          test "$RELEASE_VERSION" = "$(node -p "require('./package.json').version")"
          node -e "const m=require('./manifest.json'), v=require('./versions.json'); if (v[m.version] !== m.minAppVersion) process.exit(1)"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish release with plugin assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.release_version }}
          target_commitish: ${{ github.sha }}
          name: FlashCard ${{ steps.version.outputs.release_version }}
          body: |
            ## FlashCard

            Automatic flashcards, spaced repetition, active recall, and retention analytics. Local and free.

            ## Requirements
            Obsidian 1.7.2 or newer.

            ## Included files
            - `main.js`: production plugin bundle
            - `manifest.json`: plugin metadata
            - `styles.css`: plugin styles

            The release is published only after the test suite, production build, and version checks pass.
          files: |
            main.js
            manifest.json
            styles.css
          fail_on_unmatched_files: true
